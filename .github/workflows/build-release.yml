name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
        type: string
      publish:
        description: Create a draft GitHub Release after successful builds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  buildroot:
    name: Build rootfs (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - riscv64
          - aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install missing Buildroot prerequisites
        run: |
          required_packages=(
            bc
            binutils
            build-essential
            bzip2
            cpio
            file
            gawk
            git
            gzip
            patch
            perl
            python3
            rsync
            tar
            unzip
            wget
            debianutils
            xz-utils
            zstd
          )
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! dpkg-query --show --showformat='${db:Status-Status}' "${package}" 2>/dev/null | grep -qx installed; then
              missing_packages+=("${package}")
            fi
          done
          if ((${#missing_packages[@]} == 0)); then
            echo "Buildroot prerequisites are already installed."
          else
            sudo apt-get update
            sudo apt-get install --yes "${missing_packages[@]}"
          fi

      - name: Restore Buildroot download cache
        uses: actions/cache/restore@v4
        with:
          path: producer/cache/buildroot-dl
          key: buildroot-dl-v2-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-${{ hashFiles(format('producer/buildroot/external/configs/scarlet_{0}_defconfig', matrix.arch)) }}
          restore-keys: |
            buildroot-dl-v2-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-
            buildroot-dl-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-
            nightly-buildroot-dl-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-

      - name: Restore Buildroot output cache
        uses: actions/cache/restore@v4
        with:
          path: producer/cache/buildroot-${{ matrix.arch }}/output
          key: buildroot-output-v2-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-${{ hashFiles('producer/buildroot/external/**', 'producer/buildroot/patches/**', 'producer/tools/build_buildroot.sh') }}

      - name: Build rootfs and legal information
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          ARTIFACT_DIR: ${{ github.workspace }}/producer/artifacts
          BUILDROOT_DL_DIR: ${{ github.workspace }}/producer/cache/buildroot-dl
        run: bash producer/tools/build_buildroot.sh

      - name: Package Buildroot host SDK
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
        run: |
          host_zstd="${BUILDROOT_DIR}/output/host/bin/zstd"
          sdk_archive="producer/buildroot-sdk-${ARCH}.tar.zst"
          test -x "${host_zstd}"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime \
            -C "${BUILDROOT_DIR}/output" -cf - host | \
            "${host_zstd}" -q --no-progress -19 -T1 -f -o "${sdk_archive}"

      - name: Upload Buildroot host SDK
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-sdk-${{ matrix.arch }}
          if-no-files-found: error
          path: producer/buildroot-sdk-${{ matrix.arch }}.tar.zst

      - name: Materialize versioned rootfs artifacts
        working-directory: producer
        run: |
          cp "artifacts/rootfs-${{ matrix.arch }}.tar.zst" \
            "rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          cp "artifacts/legal-info-${{ matrix.arch }}.tar.zst" \
            "legal-info-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"

      - name: Compute rootfs manifest hash
        id: artifact
        working-directory: producer
        run: |
          artifact_hash="$(../scripts/compute-artifact-hash.sh \
            "rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst")"
          printf 'sha256=%s\n' "${artifact_hash}" >> "$GITHUB_OUTPUT"

      - name: Generate rootfs manifest fragment
        working-directory: producer
        run: |
          cat > "manifest-${{ matrix.arch }}.toml" <<EOF
          [[layers]]
          kind = "archive"
          url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          sha256 = "${{ steps.artifact.outputs.sha256 }}"
          format = "tar-zst"
          strip_components = 1
          to = "/system/linux-${{ matrix.arch }}"
          EOF

      - name: Upload rootfs release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-rootfs-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            producer/rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/legal-info-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/manifest-${{ matrix.arch }}.toml

      - name: Save Buildroot output cache
        uses: actions/cache/save@v4
        with:
          path: producer/cache/buildroot-${{ matrix.arch }}/output
          key: buildroot-output-v2-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-${{ hashFiles('producer/buildroot/external/**', 'producer/buildroot/patches/**', 'producer/tools/build_buildroot.sh') }}

      - name: Save Buildroot download cache
        uses: actions/cache/save@v4
        with:
          path: producer/cache/buildroot-dl
          key: buildroot-dl-v2-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-${{ hashFiles(format('producer/buildroot/external/configs/scarlet_{0}_defconfig', matrix.arch)) }}

  mozc:
    name: Build Mozc (${{ matrix.arch }})
    needs: buildroot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - riscv64
          - aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Mozc prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd

      - name: Verify Bazelisk
        run: command -v bazelisk

      - name: Restore Mozc build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazelisk
            producer/cache/work/bazel-${{ matrix.arch }}
          key: mozc-bazel-${{ runner.os }}-${{ matrix.arch }}-3f235b4-0bde52d-${{ hashFiles('producer/tools/build_mozc_server.sh', format('producer/buildroot/external/configs/scarlet_{0}_defconfig', matrix.arch)) }}
          restore-keys: |
            mozc-bazel-${{ runner.os }}-${{ matrix.arch }}-

      - name: Download Buildroot host SDK
        uses: actions/download-artifact@v4
        with:
          name: buildroot-sdk-${{ matrix.arch }}
          path: producer/cache/buildroot-${{ matrix.arch }}

      - name: Extract Buildroot host SDK
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          buildroot_dir="producer/cache/buildroot-${ARCH}"
          mkdir -p "${buildroot_dir}/output"
          zstd --decompress --stdout "${buildroot_dir}/buildroot-sdk-${ARCH}.tar.zst" | \
            tar -xf - -C "${buildroot_dir}/output"
          test -x "${buildroot_dir}/output/host/bin/zstd"

      - name: Build Mozc server
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          WORKDIR: ${{ github.workspace }}/producer/cache/work
          MOZC_HOST_PYTHON: /usr/bin/python3
          MOZC_REV: 3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732
          MUSL_FTS_REV: 0bde52df588e8969879a2cae51c3a4774ec62472
        run: bash producer/tools/build_mozc_server.sh

      - name: Package Mozc server
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          ARTIFACT_DIR: ${{ github.workspace }}/producer/artifacts
        run: bash producer/tools/package_mozc.sh

      - name: Materialize versioned Mozc artifact
        working-directory: producer
        run: |
          cp "artifacts/mozc-${{ matrix.arch }}.tar.zst" \
            "mozc-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"

      - name: Compute Mozc manifest hash
        id: artifact
        working-directory: producer
        run: |
          artifact_hash="$(../scripts/compute-artifact-hash.sh \
            "mozc-${{ matrix.arch }}-${{ inputs.version }}.tar.zst")"
          printf 'sha256=%s\n' "${artifact_hash}" >> "$GITHUB_OUTPUT"

      - name: Generate Mozc manifest fragment
        working-directory: producer
        run: |
          cat > "manifest-mozc-${{ matrix.arch }}.toml" <<EOF
          [[layers]]
          kind = "archive"
          url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/mozc-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          sha256 = "${{ steps.artifact.outputs.sha256 }}"
          format = "tar-zst"
          strip_components = 1
          to = "/system/linux-${{ matrix.arch }}"
          EOF

      - name: Upload Mozc release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mozc-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            producer/mozc-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/manifest-mozc-${{ matrix.arch }}.toml

  apps-demo:
    name: Build apps-demo (${{ matrix.arch }})
    needs: buildroot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - riscv64
          - aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install apps-demo prerequisites
        run: |
          required_packages=(
            gettext
            meson
            ninja-build
            pkg-config
            zstd
          )
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! dpkg-query --show --showformat='${db:Status-Status}' "${package}" 2>/dev/null | grep -qx installed; then
              missing_packages+=("${package}")
            fi
          done
          if ((${#missing_packages[@]} == 0)); then
            echo "apps-demo prerequisites are already installed."
          else
            sudo apt-get update
            sudo apt-get install --yes "${missing_packages[@]}"
          fi

      - name: Restore user-programs work cache
        uses: actions/cache/restore@v4
        with:
          path: producer/cache/work
          key: apps-demo-work-${{ runner.os }}-${{ matrix.arch }}-v1-${{ hashFiles('producer/tools/build_user_programs.sh', 'producer/tools/package_apps_demo.sh') }}
          restore-keys: |
            apps-demo-work-${{ runner.os }}-${{ matrix.arch }}-v1-
            apps-demo-work-${{ runner.os }}-${{ matrix.arch }}-

      - name: Download Buildroot host SDK
        uses: actions/download-artifact@v4
        with:
          name: buildroot-sdk-${{ matrix.arch }}
          path: producer/cache/buildroot-${{ matrix.arch }}

      - name: Extract Buildroot host SDK
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          buildroot_dir="producer/cache/buildroot-${ARCH}"
          mkdir -p "${buildroot_dir}/output"
          zstd --decompress --stdout "${buildroot_dir}/buildroot-sdk-${ARCH}.tar.zst" | \
            tar -xf - -C "${buildroot_dir}/output"
          test -x "${buildroot_dir}/output/host/bin/zstd"

      - name: Build user programs
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          WORKDIR: ${{ github.workspace }}/producer/cache/work
        run: bash producer/tools/build_user_programs.sh

      - name: Package apps-demo
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          ARTIFACT_DIR: ${{ github.workspace }}/producer/artifacts
        run: bash producer/tools/package_apps_demo.sh

      - name: Materialize versioned apps-demo artifact
        working-directory: producer
        run: |
          cp "artifacts/apps-demo-${{ matrix.arch }}.tar.zst" \
            "apps-demo-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"

      - name: Compute apps-demo manifest hash
        id: artifact
        working-directory: producer
        run: |
          artifact_hash="$(../scripts/compute-artifact-hash.sh \
            "apps-demo-${{ matrix.arch }}-${{ inputs.version }}.tar.zst")"
          printf 'sha256=%s\n' "${artifact_hash}" >> "$GITHUB_OUTPUT"

      - name: Generate apps-demo manifest fragment
        working-directory: producer
        run: |
          cat > "manifest-apps-demo-${{ matrix.arch }}.toml" <<EOF
          [[layers]]
          kind = "archive"
          url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/apps-demo-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          sha256 = "${{ steps.artifact.outputs.sha256 }}"
          format = "tar-zst"
          strip_components = 1
          to = "/system/linux-${{ matrix.arch }}"
          EOF

      - name: Upload apps-demo release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apps-demo-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            producer/apps-demo-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/manifest-apps-demo-${{ matrix.arch }}.toml

      - name: Save user-programs work cache
        uses: actions/cache/save@v4
        with:
          path: producer/cache/work
          key: apps-demo-work-${{ runner.os }}-${{ matrix.arch }}-v1-${{ hashFiles('producer/tools/build_user_programs.sh', 'producer/tools/package_apps_demo.sh') }}

  release:
    name: Create draft release
    needs:
      - buildroot
      - mozc
      - apps-demo
    if: success() && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: release-assets/**
