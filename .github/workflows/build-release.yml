name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
        type: string
      publish:
        description: Create a draft GitHub Release after successful builds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build rootfs (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - riscv64
          - aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install missing Buildroot prerequisites
        run: |
          required_packages=(
            bc
            binutils
            build-essential
            bzip2
            cpio
            file
            gawk
            git
            gzip
            patch
            perl
            python3
            rsync
            tar
            unzip
            wget
            debianutils
            xz-utils
          )
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! dpkg-query --show --showformat='${db:Status-Status}' "${package}" 2>/dev/null | grep -qx installed; then
              missing_packages+=("${package}")
            fi
          done
          if ((${#missing_packages[@]} == 0)); then
            echo "Buildroot prerequisites are already installed."
          else
            sudo apt-get update
            sudo apt-get install --yes "${missing_packages[@]}"
          fi

      - name: Restore Buildroot download cache
        uses: actions/cache@v4
        with:
          path: producer/cache/buildroot-dl
          key: buildroot-dl-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-${{ hashFiles(format('producer/buildroot/external/configs/scarlet_{0}_defconfig', matrix.arch)) }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ matrix.arch }}-2025.02.6-

      - name: Build rootfs and legal information
        env:
          ARCH: ${{ matrix.arch }}
          BUILDROOT_DIR: ${{ github.workspace }}/producer/cache/buildroot-${{ matrix.arch }}
          PREBUILT_DIR: ${{ github.workspace }}/producer/prebuilt
          ARTIFACT_DIR: ${{ github.workspace }}/producer/artifacts
          BUILDROOT_DL_DIR: ${{ github.workspace }}/producer/cache/buildroot-dl
        run: bash producer/tools/build_buildroot.sh

      - name: Materialize versioned release artifacts
        working-directory: producer
        run: |
          cp "artifacts/rootfs-${{ matrix.arch }}.tar.zst" \
            "rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          cp "artifacts/legal-info-${{ matrix.arch }}.tar.zst" \
            "legal-info-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"

      - name: Compute rootfs manifest hash
        id: artifact
        working-directory: producer
        run: |
          artifact_hash="$(../scripts/compute-artifact-hash.sh \
            "rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst")"
          printf 'sha256=%s\n' "${artifact_hash}" >> "$GITHUB_OUTPUT"

      - name: Generate cargo-scarlet manifest fragment
        working-directory: producer
        run: |
          cat > "manifest-${{ matrix.arch }}.toml" <<EOF
          [[layers]]
          kind = "archive"
          url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst"
          sha256 = "${{ steps.artifact.outputs.sha256 }}"
          format = "tar-zst"
          strip_components = 1
          to = "/system/linux-${{ matrix.arch }}"
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            producer/rootfs-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/legal-info-${{ matrix.arch }}-${{ inputs.version }}.tar.zst
            producer/manifest-${{ matrix.arch }}.toml

  release:
    name: Create draft release
    needs: build
    if: success() && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: release-assets/**
